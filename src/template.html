<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quran &amp; Duas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Noto+Nastaliq+Urdu:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:IndoPak;src:url(data:font/ttf;base64,__FONT__) format("truetype");font-display:block}
:root{
  --bg:#f7f3ea;--card:#fffdf8;--ink:#2a2620;--muted:#7b7266;--line:#e7dfd0;
  --accent:#1f6f5c;--accent-soft:#e3efe9;--gold:#b08a3e;--hl:#fff3cf;--rule:#cfc4ae;
  --ar-size:30px;--en-size:16px;
}
[data-theme=white]{--bg:#ffffff;--card:#f8f8f6;--ink:#1d1d1b;--muted:#6f6f6a;--line:#e6e6e1;--accent:#1f6f5c;--accent-soft:#e6f0ec;--gold:#a8822f;--hl:#fff4cc;--rule:#d2d2cc}
[data-theme=sepia]{--bg:#f2e6cf;--card:#f9f0de;--ink:#3a2a1a;--muted:#7d6549;--line:#dfcca9;--accent:#2a8c78;--accent-soft:#dcebe2;--gold:#8f6a2a;--hl:#fde9a8;--rule:#bfa57c}
[data-theme=black]{--bg:#000;--card:#0c0f11;--ink:#ebe8e1;--muted:#8d8a83;--line:#22272b;--accent:#6fd3b5;--accent-soft:#11302a;--gold:#d4b06a;--hl:#2a2614;--rule:#2e353a}
[data-theme=maroon]{--pcnx:#7a1d2e;--bg:#2e0a11;--card:#43121c;--ink:#f6e7c8;--muted:#d1ad86;--line:#5e2230;--accent:#e3b257;--accent-soft:#5a2a1c;--gold:#e8bd62;--hl:#5c2a17;--rule:#7a3a3f}
[data-theme=maroon] body{background:radial-gradient(ellipse 120% 70% at 50% 0%,#5a1724 0%,#2e0a11 60%) fixed}
[data-theme=royal]{--vbg:linear-gradient(160deg,#3d1622,#22121a);--vline:#4e1f2c;--bg:#12161a;--card:#1a2026;--ink:#ece6da;--muted:#9a9488;--line:#2a323a;--accent:#e2b65e;--fill:#8a2236;--accent-soft:#3a1a22;--gold:#e2b65e;--hl:#3a1a22;--rule:#3a444d}
[data-theme=royal] :is(.continue,.tab.on,.verse.playing .ref,.seg button.on,.jumpbox button,.btn.pri,.next,.alertbar,.chip.on,.listen,.pbar #pPlay,.prayer-card){color:#f6dc95}
[data-theme=royal] .qs .sfoot .sdone{color:#1a1408}
[data-theme=violet]{--bg:#14111c;--card:#1d1828;--ink:#efe9f7;--muted:#a79db8;--line:#2e2640;--accent:#c9aaff;--fill:#6a42b0;--accent-soft:#2c2145;--gold:#e2b65e;--hl:#33264f;--rule:#3d3354;--vbg:linear-gradient(160deg,#2c2048,#1b1629);--vline:#3a2d58}
[data-theme=violet] :is(.continue,.tab.on,.verse.playing .ref,.seg button.on,.jumpbox button,.btn.pri,.next,.alertbar,.chip.on,.listen,.pbar #pPlay,.prayer-card){color:#f6efff}
[data-theme=violet] .qs .sfoot .sdone{color:#1a1408}
[data-theme=sky]{--bg:#e8f2fa;--card:#f7fbff;--ink:#15314a;--muted:#5a7590;--line:#cddfee;--accent:#1d6fb0;--fill:#2378c0;--accent-soft:#d5e7f7;--gold:#b98326;--hl:#fff1c9;--rule:#b9cfe2;--vbg:linear-gradient(180deg,#ffffff,#f1f7fc);--vline:#d3e3f1}
:is([data-theme=royal],[data-theme=violet],[data-theme=sky],[data-theme=navy],[data-theme=lavender],[data-theme=emerald]) :is(.verse,.dbody){background:var(--vbg);border:1px solid var(--vline);border-radius:16px;padding:16px 14px;margin:12px 0}
:is([data-theme=royal],[data-theme=violet],[data-theme=sky],[data-theme=navy],[data-theme=lavender],[data-theme=emerald]) .dbody{border-radius:14px;padding:12px 6px;margin:10px -10px}
:is([data-theme=royal],[data-theme=violet],[data-theme=sky],[data-theme=navy],[data-theme=lavender],[data-theme=emerald]) .verse.playing{box-shadow:0 0 0 2px var(--gold);background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 22%,transparent),transparent 70%),var(--vbg)}
[data-theme=sky] .ayah-card{background:linear-gradient(170deg,#dcebf8,var(--card))}
[data-theme=navy]{--bg:#0b1426;--card:#111d35;--ink:#eaf0fa;--muted:#9aa9c2;--line:#22324f;--accent:#e2b65e;--fill:#1f4e8c;--accent-soft:#1a2c4d;--gold:#e2b65e;--hl:#1d3358;--rule:#2b3e60;--vbg:linear-gradient(160deg,#16294a,#0f1a30);--vline:#263a5e}
[data-theme=navy] :is(.continue,.tab.on,.verse.playing .ref,.seg button.on,.jumpbox button,.btn.pri,.next,.alertbar,.chip.on,.listen,.pbar #pPlay,.prayer-card){color:#f6dc95}
[data-theme=navy] .qs .sfoot .sdone{color:#1a1408}
[data-theme=lavender]{--bg:#F2E9FF;--card:#FBF8FF;--ink:#25134D;--muted:#6E5C96;--line:#E2D3FD;--accent:#6A2FC8;--fill:#6A2FC8;--accent-soft:#E6D8FF;--gold:#9D71E8;--hl:#E9DCFF;--rule:#D1B8FF;--vbg:linear-gradient(160deg,#FFFFFF,#F7F1FF);--vline:#E2D3FD}
[data-theme=lavender] body{background:radial-gradient(ellipse 120% 60% at 50% 0%,#E4D2FF 0%,#F2E9FF 55%) fixed}
[data-theme=lavender] .prayer-card{background:linear-gradient(160deg,#6A2FC8,#25134D)}
[data-theme=lavender] .ayah-card{background:linear-gradient(170deg,#E9DCFF,var(--card))}
[data-theme=emerald]{--bg:#051F20;--card:#0B2B26;--ink:#F4F0E2;--muted:#8EB69B;--line:#1d4239;--accent:#E3C07A;--fill:#235347;--accent-soft:#163832;--gold:#E3C07A;--hl:#1b4038;--rule:#2b5a4c;--pcnx:#0B2B26;--vbg:linear-gradient(160deg,#163832 0%,#0E302A 55%,#0B2B26 100%);--vline:#2d5a4b}
[data-theme=emerald] body{background:radial-gradient(ellipse 120% 55% at 50% 0%,#12443a 0%,#051F20 62%) fixed}
[data-theme=emerald] :is(.continue,.tab.on,.verse.playing .ref,.seg button.on,.jumpbox button,.btn.pri,.next,.alertbar,.chip.on,.listen,.pbar #pPlay){color:#F3DFA6}
[data-theme=emerald] .prayer-card{background:linear-gradient(150deg,#2f6a5b 0%,#235347 45%,#0B2B26 100%);color:#F4F0E2;box-shadow:inset 0 0 0 1px rgba(227,192,122,.25)}
[data-theme=emerald] .prayer-card .tbig{color:#F3DFA6}
[data-theme=emerald] .v-en,[data-theme=emerald] .v-ur{color:#DAF1DE}
[data-theme=emerald] .v-tr{color:#8EB69B}
[data-theme=emerald] .ayah-card{background:linear-gradient(170deg,#163832,#0B2B26);box-shadow:inset 0 0 0 1px rgba(227,192,122,.18)}
[data-theme=emerald] .qs .sfoot .sdone{color:#051F20}
[data-theme=dark]{
  --bg:#12161a;--card:#1a2026;--ink:#ece6da;--muted:#9a9488;--line:#2a323a;
  --accent:#5cc2a3;--accent-soft:#1d3530;--gold:#d4b06a;--hl:#2e2a1b;--rule:#3a444d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:820px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .bar{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
header h1{font-size:17px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 .ar{font-family:IndoPak,serif;font-weight:400;color:var(--accent);margin-left:6px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--accent-soft)}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{text-align:center;padding:28px 0 8px}
.hero .ar{font-family:IndoPak,serif;font-size:34px;color:var(--accent);line-height:1.8}
.hero p{color:var(--muted);margin:2px 0 0;font-size:14px}
.continue{display:flex;align-items:center;gap:12px;background:var(--fill,var(--accent));color:#fff;border-radius:14px;padding:14px 16px;margin:18px 0 6px}
:is([data-theme=dark],[data-theme=black],[data-theme=maroon]) .continue{color:#0d1a16}
.continue small{display:block;opacity:.8;font-size:12px}
.continue b{font-weight:600}
.search{position:relative;margin:16px 0 10px}
.search input{width:100%;padding:13px 14px 13px 42px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;outline:none}
.search input:focus{border-color:var(--fill,var(--accent))}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.tabs{display:flex;gap:6px;margin:6px 0 14px;overflow-x:auto}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;white-space:nowrap;background:var(--card)}
.tab.on{background:var(--fill,var(--accent));border-color:var(--fill,var(--accent));color:#fff}
:is([data-theme=dark],[data-theme=black],[data-theme=maroon]) .tab.on{color:#0d1a16}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:border-color .15s}
.item:hover{border-color:var(--fill,var(--accent))}
.num{width:36px;height:36px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:10px;transform:rotate(45deg)}
.num span{transform:rotate(-45deg)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:15px}
.item .t small{color:var(--muted);font-size:12px}
.item .ar{font-family:IndoPak,serif;font-size:21px;color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:15px}
.result{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:block}
.result .ref{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:4px}
.result .ar{font-family:IndoPak,serif;direction:rtl;font-size:22px;line-height:1.9}
.result .en{font-size:14px;line-height:1.55;color:var(--ink)}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
/* reader */
.s-head{text-align:center;padding:26px 0 10px}
.s-head .ar{font-family:IndoPak,serif;font-size:38px;color:var(--accent)}
.s-head h2{margin:4px 0 2px;font-size:20px}
.s-head p{margin:0;color:var(--muted);font-size:13px}
.bism{font-family:IndoPak,serif;text-align:center;font-size:calc(var(--ar-size) * .95);color:var(--ink);margin:18px 0 8px;line-height:2}
.verse{padding:18px 4px 16px;border-bottom:1px solid var(--line);scroll-margin-top:70px}
.verse.flash{animation:flash 2s ease}
.verse.playing{background:var(--accent-soft);border-radius:12px}
.verse.playing .ref{background:var(--fill,var(--accent));color:#fff}
@keyframes flash{0%,40%{background:var(--hl)}100%{background:transparent}}
.v-tools{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.v-tools .ref{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px;margin-right:auto}
.v-tools .icon-btn{width:32px;height:32px;color:var(--muted)}
.v-tools .icon-btn.on{color:var(--gold)}
.v-tools .icon-btn.on svg{fill:var(--gold)}
.v-ar{font-family:IndoPak,serif;direction:rtl;text-align:center;font-size:var(--ar-size);line-height:2.3em;margin:4px 0 12px;background-image:linear-gradient(to bottom,transparent calc(2.3em - 1px),var(--rule) calc(2.3em - 1px));background-size:100% 2.3em}
.v-ur{font-family:"Noto Nastaliq Urdu",serif;direction:rtl;text-align:right;font-size:18px;line-height:2.3;margin-top:6px}
.hide-en .v-en,.hide-ur .v-ur{display:none}
.result .ur{font-family:"Noto Nastaliq Urdu",serif;direction:rtl;font-size:16px;line-height:2.2}
.v-ar .end{color:var(--accent);margin-right:.15em;white-space:nowrap}
.v-en{font-size:var(--en-size);line-height:1.65;color:var(--ink)}
.nav-surah{display:flex;gap:10px;margin-top:26px}
.nav-surah a{flex:1;text-align:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-weight:500}
.nav-surah a:hover{border-color:var(--fill,var(--accent))}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-radius:18px 18px 0 0;padding:18px 20px 28px;z-index:21;display:none;border:1px solid var(--line)}
.sheet.open,.sheet-bg.open{display:block}
.sheet h3{margin:0 0 14px;font-size:16px}
.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.row:last-child{border:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:7px 12px;font-size:14px}
.seg button.on{background:var(--fill,var(--accent));color:#fff}
:is([data-theme=dark],[data-theme=black],[data-theme=maroon]) .seg button.on{color:#0d1a16}
input[type=range]{accent-color:var(--accent);width:150px}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:36px;line-height:1.6}
.jumpbox{display:flex;gap:8px}
.jumpbox input{width:80px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.jumpbox button{padding:8px 12px;border-radius:8px;background:var(--fill,var(--accent));color:#fff}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:11px;color:var(--muted);font-weight:500}
.tabbar a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--accent)}
/* duas */
.trtog{display:inline-flex;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:500;color:var(--ink)}.trtog b{font-weight:600;min-width:24px;text-align:left;color:var(--muted)}.trtog.on b{color:var(--accent)}
.trtog .sw{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s}.trtog .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}.trtog.on .sw{background:var(--fill,var(--accent))}.trtog.on .sw::after{left:19px}
.qstat{font-size:19px;font-weight:600;color:var(--ink);margin:10px 0 2px;min-height:28px}.qstat.ok{color:var(--accent)}
.dial.aligned #roseAll circle{fill:color-mix(in srgb,var(--accent) 16%,var(--bg))}
.dtop{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;flex-direction:column;gap:10px}
.dseg{display:flex;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.dseg::-webkit-scrollbar{display:none}.dseg button{flex:0 0 auto;white-space:nowrap;padding:10px 14px!important;font-size:14px!important}.nm99{align-items:center}.nm99 .nn{min-width:26px;color:var(--muted);font-size:13px;text-align:center}.nm99 .nar{font-family:IndoPak,serif;font-size:24px;line-height:1.6;direction:rtl}.dsec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 6px;color:var(--accent)}.dsec b{font-size:17px}.dsec span{font-family:"Noto Nastaliq Urdu",serif;font-size:16px}.dseg button{padding:10px;font-size:15px;font-weight:600}
.azseg{display:grid;grid-template-columns:repeat(5,1fr)}.azseg button{padding:8px 2px;font-size:13px}
.azsum{display:inline-block;margin-right:8px;font-size:12px;color:var(--muted)}
.aprefs{display:flex;flex-direction:column;gap:8px}
.arow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.arow span{flex:1}.arow b{display:block;font-size:15px}.arow small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.arow .sw,.trtog .sw{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:background .2s}
.arow .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.arow .sw.on{background:var(--fill,var(--accent))}.arow .sw.on::after{left:21px}
.tcal .cday{aspect-ratio:1/1;justify-content:flex-start;padding-top:5px}.tcal .cday b{font-size:14px;line-height:1.2}.tcal .cday small{font-size:9px;line-height:1.2}.tcal .cday i{bottom:3px;width:5px;height:5px}.tcalev{margin-top:10px}
.dgrp{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 8px}.dgrp b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}.dgrp span{font-family:IndoPak,serif;color:var(--muted);font-size:18px}
.uvc{padding:6px 0 2px}.enb{text-align:left;line-height:1.7;margin:4px 6px 14px}.enb b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;color:var(--accent)}
.dua-item .num{transform:none;border-radius:12px;font-family:IndoPak,serif;font-size:18px}
.dua-item .num span{transform:none}
.note{font-style:italic;color:var(--gold);text-align:center;font-size:15px;padding:18px 8px 6px;line-height:1.5}
.note.h{font-style:normal;font-weight:600;color:var(--accent);font-size:17px}
.note .nur{display:block;font-style:normal;font-family:"Noto Nastaliq Urdu",serif;direction:rtl;font-size:15px;line-height:2.2;color:var(--muted)}
.hide-ur .note .nur{display:none}
.v-tr{font-size:13px;letter-spacing:.02em;color:var(--muted);margin:0 0 6px;line-height:1.5}
.hide-tr .v-tr{display:none}
.dverse{padding:12px 4px 14px;border-bottom:1px solid var(--line)}
.dverse .v-ar{margin:0 0 8px}
details.merits{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0 10px}
details.merits summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.merits div{font-size:14px;line-height:1.65;white-space:pre-line;margin-top:8px;color:var(--ink)}
/* prayer */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.loc{display:flex;align-items:center;gap:10px}
.loc b{flex:1;font-size:15px}
.btn{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:500}
.btn.pri{background:var(--fill,var(--accent));border-color:var(--fill,var(--accent));color:#fff}
:is([data-theme=dark],[data-theme=black],[data-theme=maroon]) .btn.pri{color:#0d1a16}
.next{text-align:center;padding:22px 10px;background:var(--fill,var(--accent));color:#fff;border-radius:16px;margin:12px 0}
:is([data-theme=dark],[data-theme=black],[data-theme=maroon]) .next{color:#0d1a16}
.next small{opacity:.85;font-size:13px}
.next .nm{font-size:26px;font-weight:600;margin:4px 0}
.next .cd{font-size:15px;font-variant-numeric:tabular-nums}
.ptable .pr{display:flex;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);gap:10px}
.ptable .pr:last-child{border:0}
.ptable .pr span{flex:1;font-size:15px}

.evu{font-family:"Noto Nastaliq Urdu",serif;direction:rtl;font-size:14px;line-height:2.1;color:var(--muted);margin-top:4px}

.upr{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.upr:last-child{border:0}

.dedi{text-align:center;margin-top:16px;padding:22px 20px;border:1px solid color-mix(in srgb,var(--gold,#c4923a) 45%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--gold,#c4923a) 10%,var(--card)),var(--card))}.dedi .dstar{color:var(--gold,#c4923a);font-size:18px;letter-spacing:8px}.dedi .dar{font-family:IndoPak,serif;font-size:26px;line-height:1.9;color:var(--accent);margin:4px 0 8px}.dedi p{font-size:15px;line-height:1.55;color:var(--ink);margin:0}.dedi .dsub{font-size:13.5px;color:var(--muted);margin-top:8px}

.qs .rlist{display:flex;flex-direction:column;gap:8px;margin:4px 0 6px}
.qs .rlist button{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 16px;border-radius:14px;background:var(--bg);text-align:left;color:var(--ink);border:2px solid transparent}
.qs .rlist button.on{border-color:var(--gold)}
.offa{margin:10px 0 4px;padding:12px 14px;border-radius:14px;background:var(--bg)}

:is([data-theme=dark],[data-theme=black],[data-theme=maroon]) .qs .sfoot .sdone{color:#1a1408}
body .ayah-card .v-en{display:block!important}

<script>
(function(){
const D=JSON.parse(document.getElementById('qdata').textContent);
const META=D.m, JUZ=D.j, BISM=D.b, WU=D.w.map(s=>s.split('\n')), WB=D.wb, TL=JSON.parse(document.getElementById('tldata').textContent).map(s=>s.split('\n'));
let EN,UR;const AR=D.a.map(s=>s.split('\n')), EN_S=D.e.map(s=>s.split('\n')), EN_Q=JSON.parse(document.getElementById('enqdata').textContent).e.map(s=>s.split('\n')), UR_J=D.u.map(s=>s.split('\n')),URX=JSON.parse(document.getElementById('urxdata').textContent), CL=D.c.map(s=>s.split('\n'));
const $=id=>document.getElementById(id), app=$('app');

/* storage (safe) */
const store={get(k,d){try{const v=localStorage.getItem('qr_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('qr_'+k,JSON.stringify(v))}catch(e){}}};
const S={arSize:store.get('arSize',40),tr:store.get('tr','off'),
         theme:store.get('theme','sky'),
         marks:store.get('marks',[]),showTr:store.get('showTr',false),enSize:store.get('enSize',16),rules:store.get('rules',false),font:store.get('font','indopak'),ensrc:store.get('ensrc2','alt'),rec:store.get('rec','alafasy'),urT:store.get('urT','junagarhi'),enT:store.get('enT','sahih'),last:store.get('last',null),tab:'surahs',q:''};

EN=S.enT==='qarai'?EN_Q:EN_S;
const urFor=k=>URX[k]?(URX[k].sp||(URX[k].sp=URX[k].map(x=>x.split('\n')))):UR_J;UR=urFor(S.urT);
const arNum=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const typeName=t=>t==='m'?'Meccan':'Medinan';
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600)}
const icon={
  mark:'<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  play:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z" fill="currentColor"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>',
  play2:'<svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z" fill="currentColor"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2"><path d="M9 18l6-6-6-6"/></svg>'
};

function applySettings(){
  document.documentElement.dataset.theme=S.theme;
  document.documentElement.style.setProperty('--ar-size',S.arSize+'px');
  document.body.classList.toggle('hide-en',!(S.tr==='en'||S.tr==='both'));document.body.classList.toggle('hide-ur',!(S.tr==='ur'||S.tr==='both'));
  document.body.classList.toggle('hide-tr',!S.showTr||S.tr==='off');document.body.classList.toggle('font-madani',S.font==='madani');
  $('arSize').value=S.arSize;$('enSize').value=S.enSize;
  document.documentElement.style.setProperty('--en-size',S.enSize+'px');
  document.body.classList.toggle('no-rule',!S.rules);
  $('trSw').classList.toggle('on',S.showTr);$('ruleSw').classList.toggle('on',S.rules);
  [...$('fontSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.v===S.font));
  [...$('enSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.v===S.tr));[...$('enTSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.v===S.enT));[...$('urTSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.v===S.urT));document.querySelectorAll('#setSheet [data-lang]').forEach(x=>x.style.display=(S.tr==='both'||S.tr===x.dataset.lang)?'':'none');
  document.querySelectorAll('[data-trtog]').forEach(b=>{const on=S.tr!=='off';b.classList.toggle('on',on);b.setAttribute('aria-checked',on);b.querySelector('b').textContent=on?'On':'Off'});
  if(S.tr!=='off')store.set('trLast',S.tr);
  [...$('thSeg').children].forEach(b=>b.classList.toggle('on',b.dataset.v===S.theme));
  $('arLvl').textContent=Math.round((S.arSize-20)/4)+1;$('enLvl').textContent=S.enSize-11;
  const pe=$('prevEn');pe.textContent=S.tr==='ur'?UR[0][0]:EN[0][0];pe.style.display=S.tr==='off'?'none':'';pe.style.fontFamily=S.tr==='ur'?"'Noto Nastaliq Urdu',serif":'';pe.dir=S.tr==='ur'?'rtl':'ltr';if(location.hash.startsWith('#dua-'))ctxSettings();
}

/* ---------- Home ---------- */
function surahItem(i){
  const m=META[i];
  return `<a class="item" href="#surah-${i+1}"><div class="num"><span>${i+1}</span></div>
    <div class="t"><b>${esc(m[1])}</b><small>${esc(m[2])} · ${m[4]} verses</small></div><div class="ar">${m[0]}</div></a>`;
}
function renderHome(){
  setHeader('Quran',false);
  const last=S.last;
  app.innerHTML=`
   <div class="hero"><div class="ar">القرآن الكريم</div></div>
   ${last?`<a class="continue" href="#surah-${last.s}-${last.v}"><div style="flex:1"><small>Continue reading</small><b>${esc(META[last.s-1][1])} · Verse ${last.v}</b></div>${icon.arrow}</a>`:''}
   <div class="search">${icon.search}<input id="q" type="search" placeholder="Search surah, 2:255, or a word in English / Urdu / Arabic" value="${esc(S.q)}" autocomplete="off"></div>
   <div class="tabs" id="tabs">
     <button class="tab" data-t="surahs">Surahs</button><button class="tab" data-t="juz">Juz</button><button class="tab" data-t="marks">Bookmarks${S.marks.length?' ('+S.marks.length+')':''}</button>
   </div>
   <div id="body"></div>
`;
  const q=$('q');
  q.addEventListener('input',()=>{S.q=q.value;renderBody()});
  $('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;S.tab=b.dataset.t;S.q='';q.value='';renderBody()});
  renderBody();
}
function renderBody(){
  const body=$('body');
  [...document.querySelectorAll('.tab')].forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab&&!S.q.trim()));
  const q=S.q.trim();
  if(q){body.innerHTML=searchHTML(q);return}
  if(S.tab==='surahs'){body.innerHTML=`<div class="list">${META.map((_,i)=>surahItem(i)).join('')}</div>`}
  else if(S.tab==='juz'){
    body.innerHTML=`<div class="list">${JUZ.map(([s,v],i)=>`<a class="item" href="#surah-${s}-${v}"><div class="num"><span>${i+1}</span></div>
      <div class="t"><b>Juz ${i+1}</b><small>Starts at ${esc(META[s-1][1])} ${s}:${v}</small></div></a>`).join('')}</div>`;
  } else {
    if(!S.marks.length){body.innerHTML='<div class="empty">No bookmarks yet.<br>Tap the bookmark icon on any verse to save it here.</div>';return}
    body.innerHTML=S.marks.map(([s,v])=>`<a class="result" href="#surah-${s}-${v}"><div class="ref">${esc(META[s-1][1])} · ${s}:${v}</div>
      <div class="ar">${ARX()[s-1][v-1]}</div><div class="en">${esc(EN[s-1][v-1])}</div><div class="ur">${esc(UR[s-1][v-1])}</div></a>`).join('');
  }
}
/* Arabic normalisation for search */
const normAr=s=>s.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
let CLN=null,URN=null;
const normUr=s=>normAr(s).replace(/[ہھۃ]/g,'ه').replace(/[یے]/g,'ي').replace(/ک/g,'ك');
function searchHTML(q){
  // reference like 2:255
  const ref=q.match(/^(\d{1,3})\s*[:.\s]\s*(\d{1,3})$/);
  let out='';
  if(ref){const s=+ref[1],v=+ref[2];if(META[s-1]&&v>=1&&v<=META[s-1][4])out+=`<a class="result" href="#surah-${s}-${v}"><div class="ref">Go to ${esc(META[s-1][1])} ${s}:${v}</div><div class="en">${esc(EN[s-1][v-1])}</div></a>`}
  const ql=q.toLowerCase(), isAr=/[\u0600-\u06FF]/.test(q);
  const sm=META.map((m,i)=>i).filter(i=>{const m=META[i];return String(i+1)===q||m[1].toLowerCase().replace(/[-']/g,'').includes(ql.replace(/[-' ]/g,''))||m[2].toLowerCase().includes(ql)||normAr(m[0]).includes(normAr(q))});
  if(sm.length)out+=`<div class="list" style="margin-bottom:14px">${sm.slice(0,12).map(surahItem).join('')}</div>`;
  if(q.length<3&&!isAr) return out||'<div class="empty">Keep typing to search verses…</div>';
  const res=[];let total=0;
  if(isAr){
    if(!CLN)CLN=CL.map(a=>a.map(normAr));
    const nq=normAr(q);
    if(!URN)URN=UR.map(a=>a.map(normUr));const uq=normUr(q);
    CLN.forEach((a,s)=>a.forEach((t,v)=>{if(t.includes(nq)||URN[s][v].includes(uq)){total++;if(res.length<100)res.push([s,v])}}));
  } else {
    const re=new RegExp(ql.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
    EN.forEach((a,s)=>a.forEach((t,v)=>{if(re.test(t)){total++;if(res.length<100)res.push([s,v])}}));
  }
  const hl=t=>{if(isAr)return esc(t);const e=esc(t);return e.replace(new RegExp('('+esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')};
  out+=`<div style="color:var(--muted);font-size:13px;margin:4px 2px 10px">${total} verse${total===1?'':'s'} found${total>100?' · showing first 100':''}</div>`;
  out+=res.map(([s,v])=>`<a class="result" href="#surah-${s+1}-${v+1}"><div class="ref">${esc(META[s][1])} · ${s+1}:${v+1}</div>
     ${isAr?`<div class="ar">${ARX()[s][v]}</div><div class="ur">${esc(UR[s][v])}</div>`:`<div class="en">${hl(EN[s][v])}</div>`}</a>`).join('');
  return out;
}

/* ---------- Font / recitation / reading options ---------- */
const ARX=()=>S.font==='madani'?WU:AR;
const BISMX=()=>S.font==='madani'?WB:BISM;
const endMark=n=>S.font==='madani'?'﴿'+arNum(n)+'﴾':'۝'+arNum(n);
const p3=n=>String(n).padStart(3,'0');
const AUD_ALL={alafasy:JSON.parse(document.getElementById('auddata').textContent)};
{const x=JSON.parse(document.getElementById('audsdata').textContent);if(x)AUD_ALL.sudais=x}
const RECS=[['alafasy','Mishary Rashid Alafasy','Murattal'],['sudais','Abdur Rahman As-Sudais','Murattal']].filter(r=>AUD_ALL[r[0]]);
if(!AUD_ALL[S.rec])S.rec='alafasy';
let AUD=AUD_ALL[S.rec];
const recName=()=>(RECS.find(r=>r[0]===S.rec)||RECS[0])[1];
/* ---------- In-app recitation player (Mishary Alafasy) ---------- */
const P=window.__P={el:new Audio(),s:0,v:0,part:-1,on:false,repeat:false,cont:true,blobs:{}};
P.el.preload='auto';
function partFor(s,ms){const ps=AUD[s-1].p;let k=0;for(let i=0;i<ps.length;i++)if(ps[i][1]<=ms)k=i;return k}
function setSrc(s,k,cb){
  const name=AUD[s-1].p[k][0],url=/^https?:/.test(name)?name:'audio/'+name;P.part=k;P.srcS=s;
  const useBlob=()=>{fetch(url).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(b=>{const u=URL.createObjectURL(b);P.blobs[name]=u;P.el.addEventListener('loadedmetadata',()=>cb(),{once:true});P.el.src=u}).catch(()=>{toast('Could not load the recitation');stopPlayer()})};
  const wait=()=>P.el.addEventListener('loadedmetadata',()=>cb(),{once:true});
  if(P.blobs[name]){P.el.onerror=null;P.el.src=P.blobs[name];wait();return}
  const OA=window.NH&&NH.audio,loc=OA&&OA.local(url);
  if(loc){P.el.onerror=()=>{OA.forget(url);P.el.onerror=()=>{P.el.onerror=null;useBlob()};P.el.src=url;wait()};P.el.src=loc;wait();return}
  P.el.onerror=()=>{P.el.onerror=null;useBlob()};
  P.el.src=url;wait();
  if(OA)OA.played(url);
}
function playVerse(s,v){
  const A=AUD[s-1],a=A&&A.a[v-1];if(!a)return;
  const k=partFor(s,a[0]);P.s=s;P.v=v;P.on=true;
  const seek=()=>{const off=Math.max(0,(a[0]-A.p[k][1])/1000);
    try{P.el.currentTime=off}catch(e){}P.el.play().catch(()=>{});
    if(off>2)setTimeout(()=>{const name=A.p[k][0];
      if(P.s===s&&P.part===k&&Math.abs(P.el.currentTime-off)>3&&!P.blobs[name]&&!P.el.src.startsWith('blob:')&&!(window.NH&&NH.audio&&NH.audio.has(name))){
        fetch(/^https?:/.test(name)?name:'audio/'+name).then(r=>r.blob()).then(bl=>{P.blobs[name]=URL.createObjectURL(bl);if(P.s===s&&P.part===k){P.srcS=0;playVerse(s,v)}}).catch(()=>{})}},700)};
  if(P.srcS===s&&P.part===k&&P.el.src&&P.el.readyState>=1)seek();else setSrc(s,k,seek);
  showBar();markPlaying(true);
}
function stopPlayer(){P.el.pause();P.on=false;$('pbar').classList.remove('show');document.body.classList.remove('playing');markPlaying()}
function curMs(){return AUD[P.s-1].p[P.part][1]+P.el.currentTime*1000}
function curVerse(){const A=AUD[P.s-1],ms=curMs();let v=1;for(let i=0;i<A.a.length;i++)if(A.a[i][0]<=ms+30)v=i+1;return v}
P.el.addEventListener('timeupdate',()=>{
  if(!P.on||P.part<0)return;const A=AUD[P.s-1];
  if(P.repeat&&curMs()>=A.a[P.v-1][1]-80){playVerse(P.s,P.v);return}
  const v=curVerse();if(v!==P.v){P.v=v;markPlaying(true);showBar()}
});
P.el.addEventListener('ended',()=>{
  if(!P.on)return;const A=AUD[P.s-1];
  if(P.repeat){playVerse(P.s,P.v);return}
  if(P.part+1<A.p.length){setSrc(P.s,P.part+1,()=>{P.el.play().catch(()=>{})});return}
  if(P.cont&&P.s<114){const ns=P.s+1;if(curS===P.s&&location.hash.startsWith('#surah-'))location.hash='surah-'+ns;playVerse(ns,1)}else stopPlayer();
});
P.el.addEventListener('play',()=>{$('pPlay').innerHTML=icon.pause});
P.el.addEventListener('pause',()=>{$('pPlay').innerHTML=icon.play2});
function showBar(){
  $('pbar').classList.add('show');document.body.classList.add('playing');
  $('pTitle').textContent=`${META[P.s-1][1]} · ${P.s}:${P.v}`;
  $('pRep').classList.toggle('on',P.repeat);$('pCont').classList.toggle('on',P.cont);
  try{if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:`${META[P.s-1][1]} ${P.s}:${P.v}`,artist:recName()});
    navigator.mediaSession.setActionHandler('nexttrack',()=>stepVerse(1));navigator.mediaSession.setActionHandler('previoustrack',()=>stepVerse(-1))}}catch(e){}
}
function markPlaying(scroll){
  document.querySelectorAll('.verse.playing').forEach(e=>e.classList.remove('playing'));
  if(!P.on||curS!==P.s||!location.hash.startsWith('#surah-'))return;
  const el=$('v'+P.v);if(el){el.classList.add('playing');if(scroll){const r=el.getBoundingClientRect();if(r.top<70||r.top>innerHeight*0.55)el.scrollIntoView({behavior:'smooth',block:'start'})}}
}
function stepVerse(d){if(!P.s)return;let s=P.s,v=P.v+d;if(v<1){if(s>1){s--;v=AUD[s-1].a.length}else v=1}else if(v>AUD[s-1].a.length){if(s<114){s++;v=1}else return}playVerse(s,v)}
function readbar(kind,arg){
  const c=(k,v,label)=>`<button class="chip${S[k]===v?' on':''}" data-set="${k}" data-v="${v}">${label}</button>`;
  const trLabel={off:'Arabic only',en:'English',ur:'اردو',both:'English + اردو'}[S.tr];
  let h=`<div class="readbar"><div class="aa">
    <button class="trtog${S.tr==='off'?'':' on'}" data-trtog role="switch" aria-checked="${S.tr!=='off'}"><span>Translation</span><i class="sw"></i><b>${S.tr==='off'?'Off':'On'}</b></button></div>`;
  if(kind==='quran'){
    h+=`<div class="rrow"><span class="rl">Recitation · ${esc(recName())}</span>
      <button class="listen" data-a2="playsurah">${icon.play.replace('<svg','<svg style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8"')} Play surah</button>
      <span class="hint" style="font-size:12px;color:var(--muted)">or tap ▶ on any verse</span></div>`;
  }
  return h+'</div>';
}
document.addEventListener('click',e=>{if(e.target.closest('[data-open=settings]'))openSheet('setSheet');
  if(e.target.closest('[data-trtog]')){if(S.tr==='off')S.tr=store.get('trLast','en');else{store.set('trLast',S.tr);S.tr='off'}store.set('tr',S.tr);applySettings()}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-set]');if(!b)return;
  const k=b.dataset.set,v=b.dataset.v;
  if(k==='showTr'){S.showTr=v==='1';store.set('showTr',S.showTr)}else{S[k]=v;store.set(k==='ensrc'?'ensrc2':k,v)}
  const y=window.scrollY;applySettings();route();window.scrollTo(0,y);
});
document.addEventListener('change',e=>{if(e.target.id==='recSel'){S.rec=e.target.value;store.set('rec',S.rec);const y=window.scrollY;route();window.scrollTo(0,y)}});

/* ---------- Reader ---------- */
let curS=0,obs=null;
function isMarked(s,v){return S.marks.some(m=>m[0]===s&&m[1]===v)}
function renderSurah(s,v){
  const m=META[s-1];curS=s;
  setHeader(`${m[1]}<span class="ar">${m[0]}</span>`,true);
  let h=`<div class="s-head"><div class="ar">${m[0]}</div><h2>${esc(m[1])}</h2><p>${esc(m[2])} · ${typeName(m[3])} · ${m[4]} verses</p></div>`;
  h+=readbar('quran',s);
  if(s!==1&&s!==9)h+=`<div class="bism">${BISMX()}</div>`;
  h+=ARX()[s-1].map((a,i)=>`<div class="verse" id="v${i+1}" data-v="${i+1}">
     <div class="v-tools"><span class="ref">${s}:${i+1}</span>
       <button class="icon-btn mk${isMarked(s,i+1)?' on':''}" data-a="mark" aria-label="Bookmark">${icon.mark}</button>
       <button class="icon-btn" data-a="play" aria-label="Play this verse">${icon.play}</button>
       <button class="icon-btn" data-a="copy" aria-label="Copy">${icon.copy}</button></div>
     <div class="v-ar">${a} <span class="end">${endMark(i+1)}</span></div>
     <div class="v-tr">${esc(TL[s-1][i])}</div><div class="v-en">${esc(EN[s-1][i])}</div><div class="v-ur">${esc(UR[s-1][i])}</div></div>`).join('');
  h+=`<div class="nav-surah">${s>1?`<a href="#surah-${s-1}">‹ ${esc(META[s-2][1])}</a>`:''}${s<114?`<a href="#surah-${s+1}">${esc(META[s][1])} ›</a>`:''}</div>`;
  app.innerHTML=h;
  if(v&&v>1){const el=$('v'+v);if(el){el.scrollIntoView();el.classList.add('flash')}}else window.scrollTo(0,0);
  if(obs)obs.disconnect();
  if('IntersectionObserver' in window){
    obs=new IntersectionObserver(es=>{
      const vis=es.filter(e=>e.isIntersecting).map(e=>+e.target.dataset.v);
      if(vis.length){S.last={s,v:Math.min(...vis)};store.set('last',S.last)}
    },{rootMargin:'-70px 0px -60% 0px'});
    document.querySelectorAll('.verse').forEach(el=>obs.observe(el));
  }
  S.last={s,v:v||1};store.set('last',S.last);
  markPlaying();
}
app.addEventListener('click',e=>{
  if(e.target.closest('[data-a2=playsurah]')){playVerse(curS,1);return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const v=+b.closest('.verse').dataset.v,s=curS;
  if(b.dataset.a==='play'){if(P.on&&P.s===s&&P.v===v&&!P.el.paused)P.el.pause();else playVerse(s,v);return}
  if(b.dataset.a==='mark'){
    if(isMarked(s,v)){S.marks=S.marks.filter(m=>!(m[0]===s&&m[1]===v));toast('Bookmark removed')}
    else{S.marks.push([s,v]);S.marks.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);toast('Bookmarked '+s+':'+v)}
    store.set('marks',S.marks);b.classList.toggle('on',isMarked(s,v));
  } else {
    const txt=`${ARX()[s-1][v-1]}\n\n${EN[s-1][v-1]}\n\n${UR[s-1][v-1]}\n— Quran ${s}:${v} (${META[s-1][1]})`;
    try{navigator.clipboard.writeText(txt).then(()=>toast('Verse copied'),()=>toast('Copy not allowed here'))}catch(err){toast('Copy not allowed here')}
  }
});

/* ---------- Chrome ---------- */
function setHeader(html,reader){$('title').innerHTML=html;$('backBtn').style.display=reader?'':'none';$('jumpBtn').style.display=reader?'':'none'}
function route(){
  const h=location.hash.slice(1),m=h.match(/^surah-(\d{1,3})(?:-(\d{1,3}))?$/);
  closeSheets();
  const tab=(h===''||h==='today'||h==='calendar')?'today':/^(dua|duas)/.test(h)?'duas':h==='prayer'?'prayer':h==='qibla'?'qibla':'quran';
  document.querySelectorAll('#tabbar a').forEach(a=>a.classList.toggle('on',a.dataset.tab===tab));
  if(obs&&tab!=='quran'){obs.disconnect();obs=null}
  if(window.XR&&window.XR(h)){window.scrollTo(0,0);return}
  if(m&&+m[1]>=1&&+m[1]<=114)renderSurah(+m[1],m[2]?Math.min(+m[2],META[+m[1]-1][4]):0);
  else{renderHome();window.scrollTo(0,0)}
}
function openSheet(id){if(id==='setSheet')ctxSettings();$('sheetBg').classList.add('open');$(id).classList.add('open')}
/* Settings adapt to the page: on a dua/ziyarat page only show what that text actually has */
function ctxSettings(){drawOff();
  const sh=$('setSheet');if(!sh)return;
  const h=location.hash.slice(1),dua=h.startsWith('dua-')&&h!=='dua-ayat-kursi',app=$('app');
  const has=c=>!!app.querySelector(c);
  const av=dua?{en:has('.v-en'),ur:has('.v-ur'),tl:has('.v-tr')}:{en:true,ur:true,tl:true};
  sh.classList.toggle('ctx-dua',dua);
  const vis={off:true,en:av.en,ur:av.ur,both:av.en&&av.ur};
  [...$('enSeg').children].forEach(b=>b.style.display=vis[b.dataset.v]?'':'none');
  $('enSeg').style.display=(av.en||av.ur)?'':'none';
  $('trSw').closest('.srow').style.display=av.tl?'':'none';
  const pa=sh.querySelector('.sprev .v-ar'),pe=$('prevEn');
  if(dua){const a=app.querySelector('.dverse .v-ar,.uv .v-ar');pa.innerHTML=a?a.innerHTML:'';
    const t=S.tr==='off'?null:app.querySelector((S.tr==='ur'||(S.tr==='both'&&!av.en))?'.v-ur':'.v-en');
    pe.textContent=t?t.textContent.replace(/^(English)/,''):'';pe.style.display=t?'':'none';pe.dir=t&&t.classList.contains('v-ur')?'rtl':'ltr';pe.style.fontFamily=t&&t.classList.contains('v-ur')?"'Noto Nastaliq Urdu',serif":''}
  else{pa.textContent='بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ';pe.textContent=S.tr==='ur'?UR[0][0]:EN[0][0];pe.style.display=S.tr==='off'?'none':'';pe.style.fontFamily=S.tr==='ur'?"'Noto Nastaliq Urdu',serif":'';pe.dir=S.tr==='ur'?'rtl':'ltr'}
  $('enLvl').closest('.srow').style.display=(av.en||av.ur)?'':'none';
}
function closeSheets(){document.querySelectorAll('.sheet,.sheet-bg').forEach(x=>x.classList.remove('open'))}
$('backBtn').onclick=()=>{const c=location.hash.slice(1);location.hash=/^dua-/.test(c)?'duas':c==='calendar'?'today':'home'};
$('setBtn').onclick=()=>openSheet('setSheet');
$('jumpBtn').onclick=()=>{$('jumpLbl').textContent=`Verse (1–${META[curS-1][4]})`;$('jumpIn').max=META[curS-1][4];$('jumpIn').value='';openSheet('jumpSheet');setTimeout(()=>$('jumpIn').focus(),50)};
$('jumpForm').onsubmit=e=>{e.preventDefault();const v=Math.max(1,Math.min(+$('jumpIn').value||1,META[curS-1][4]));closeSheets();const el=$('v'+v);if(el){el.scrollIntoView({behavior:'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}};
$('sheetBg').onclick=closeSheets;
$('arSize').oninput=e=>{S.arSize=+e.target.value;store.set('arSize',S.arSize);applySettings()};
$('enSize').oninput=e=>{S.enSize=+e.target.value;store.set('enSize',S.enSize);applySettings()};
document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const k=b.dataset.step==='ar'?'arSize':'enSize',lim=k==='arSize'?[20,56]:[12,26];
  S[k]=Math.max(lim[0],Math.min(lim[1],S[k]+ +b.dataset.d));store.set(k,S[k]);applySettings()});
const rerender=()=>{const y=window.scrollY,o=$('setSheet').classList.contains('open');applySettings();route();window.scrollTo(0,y);if(o)openSheet('setSheet')};
$('fontSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.font=b.dataset.v;store.set('font',S.font);rerender()};
$('trSw').onclick=()=>{S.showTr=!S.showTr;store.set('showTr',S.showTr);applySettings()};
$('ruleSw').onclick=()=>{S.rules=!S.rules;store.set('rules',S.rules);applySettings()};
$('setDone').onclick=()=>closeSheets();
const AUD_MB={alafasy:221,sudais:157};
function audUrls(){return AUD.flatMap(x=>x.p.map(q=>q[0]))}
function drawOff(){const box=$('offAud'),OA=window.NH&&NH.audio;if(!box)return;if(!OA){box.hidden=true;return}box.hidden=false;
  const st=OA.stats(audUrls()),sur=AUD.filter(x=>x.p.every(q=>OA.has(q[0]))).length,b=OA.busy(),all=st.n>=st.total;
  box.innerHTML=`<div class="ot"><span><b>Offline recitation</b><small>${all?'All 114 surahs saved on this phone':`${sur} of 114 surahs saved`}${st.mb?` · ${st.mb} MB`:''}</small></span></div>
   ${b?`<div class="bar"><i style="width:${Math.round(100*b.done/Math.max(1,b.total))}%"></i></div><small>Downloading… ${Math.round(100*b.done/Math.max(1,b.total))}% · keep the app open</small>
     <div class="ob"><button id="offStop">Stop</button></div>`
   :`<div class="ob">${all?'':`<button class="pri" id="offAll">Download all${AUD_MB[S.rec]?` (~${AUD_MB[S.rec]-st.mb} MB)`:''}</button>`}${st.n?'<button id="offDel">Delete</button>':''}</div>`}
   <div class="srow" style="margin:10px 0 0"><span>Save surahs I listen to<small class="ssub">Play them again without internet</small></span><button class="switch${OA.autoOn()?' on':''}" id="offSw" aria-label="Save surahs I listen to"></button></div>`}
$('offAud').onclick=e=>{const OA=window.NH&&NH.audio;if(!OA)return;const id=e.target.closest('button')&&e.target.closest('button').id;
  if(id==='offSw'){OA.setAuto(!OA.autoOn());drawOff()}
  else if(id==='offStop'){OA.stop()}
  else if(id==='offDel'){if(confirm('Delete the downloaded recitation for '+recName()+'?'))OA.removeAll(audUrls()).then(()=>{drawOff();toast('Downloads deleted')})}
  else if(id==='offAll'){OA.downloadAll(audUrls(),b=>{drawOff();if(b.finished)toast(b.failed?`Saved, but ${b.failed} could not download. Try again on Wi-Fi.`:b.stop?'Download stopped':'All surahs saved for offline listening')});drawOff()}};
function drawRecs(){$('recList').innerHTML=RECS.map(([k,n,t])=>`<button data-v="${k}" class="${k===S.rec?'on':''}"><i></i><span><b>${n}</b><small>${t}</small></span></button>`).join('');drawOff()}
drawRecs();$('pRec').textContent=recName();
$('recList').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.v===S.rec)return;stopPlayer();S.rec=b.dataset.v;store.set('rec',S.rec);AUD=AUD_ALL[S.rec];P.srcS=0;P.part=-1;P.s=0;drawRecs();$('pRec').textContent=recName();rerender()};
$('sTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;[...$('sTabs').children].forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('#setSheet .spane').forEach(p=>p.classList.toggle('on',p.dataset.p===b.dataset.p))};
$('setReset').onclick=()=>{Object.assign(S,{theme:'sky',font:'indopak',arSize:40,tr:'off',enT:'sahih',urT:'junagarhi',enSize:16,showTr:false,rules:false});['theme','font','arSize','tr','enT','urT','enSize','showTr','rules'].forEach(k=>store.set(k,S[k]));EN=EN_S;UR=UR_J;rerender();window.NH&&NH.setIcon&&NH.setIcon(S.theme)};
$('urTSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.urT=b.dataset.v;store.set('urT',S.urT);UR=urFor(S.urT);rerender()};
$('enTSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.enT=b.dataset.v;store.set('enT',S.enT);EN=S.enT==='qarai'?EN_Q:EN_S;rerender()};
$('enSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.tr=b.dataset.v;store.set('tr',S.tr);applySettings()};
$('thSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.theme=b.dataset.v;store.set('theme',S.theme);applySettings();window.NH&&NH.setIcon&&NH.setIcon(S.theme)};
$('pPlay').innerHTML=icon.play2;
$('pPlay').onclick=()=>{if(!P.s)return;if(P.el.paused){P.on=true;P.el.play().catch(()=>{})}else P.el.pause()};
$('pPrev').onclick=()=>stepVerse(-1);$('pNext').onclick=()=>stepVerse(1);
$('pRep').onclick=()=>{P.repeat=!P.repeat;showBar()};$('pCont').onclick=()=>{P.cont=!P.cont;showBar()};
$('pClose').onclick=stopPlayer;
$('pGo').onclick=()=>{location.hash='surah-'+P.s+'-'+P.v};
window.Q={playVerse,P,WU,AR,EN,UR,META,esc,arNum,setHeader,store,S,toast,app,$,ARX,BISMX,endMark,readbar,route};window.__BISM=BISM;
window.addEventListener('hashchange',route);
applySettings();
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',route);else setTimeout(route,0);
})();
