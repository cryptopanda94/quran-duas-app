name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    if: ${{ !contains(github.event.head_commit.message, '[android-only]') }}
    runs-on: macos-latest
    env:
      HAS_ASC: ${{ secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version
      - run: npm install
      - run: npm run build:web
      - run: npx cap add ios
      - run: npm run native:setup
      - run: npx capacitor-assets generate --ios
      - run: node scripts/ios-alt-icons.mjs
      - run: npx cap sync ios
      - run: node scripts/ios-plugins.mjs
      - name: Add widget target + App Group
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          sudo gem install xcodeproj --no-document
          ruby scripts/ios-widget-target.rb
      - name: Build for simulator (no signing)
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60

      - name: Signing certificate + App Store profiles
        if: env.HAS_ASC == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" KEYCHAIN="$RUNNER_TEMP/ci.keychain-db" KEYCHAIN_PW="$(uuidgen)"
          export OUT_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          ruby scripts/asc-sign.rb
          security find-identity -v -p codesigning "$KEYCHAIN"
      - name: Archive
        if: env.HAS_ASC == 'true'
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive 2>&1 | tail -n 40
      - name: Upload to TestFlight
        if: env.HAS_ASC == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -n 40
      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"; security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2>/dev/null || true

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build:web
      - run: npx cap add android
      - run: npm run native:setup
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - name: App version
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.1\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Build signed release bundle (Play Store)
        if: ${{ env.KS != '' }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          npx cap build android --keystorepath "$RUNNER_TEMP/upload.jks" --keystorepass "$KP" --keystorealias upload --keystorealiaspass "$KP" --androidreleasetype AAB
          ls -la android/app/build/outputs/bundle/release/
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Build signed release APK (website download / other stores)
        if: ${{ env.KS != '' }}
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          (cd android && ./gradlew assembleRelease --no-daemon)
          U=$(find android/app/build/outputs/apk/release -name '*-unsigned.apk' | head -1)
          [ -z "$U" ] && { echo 'No release APK'; ls android/app/build/outputs/apk/release; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          mkdir -p dist
          "$BT/zipalign" -f -p 4 "$U" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/upload.jks" --ks-pass env:KP --ks-key-alias upload --key-pass env:KP --out dist/QuranDuas.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/upload.jks"
          "$BT/apksigner" verify --verbose dist/QuranDuas.apk | head -5
          ls -la dist
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('dist/QuranDuas.apk') != '' }}
        with:
          name: quran-duas-release-apk
          path: dist/QuranDuas.apk
      - name: Publish APK to website (commit message contains [apk])
        if: ${{ contains(github.event.head_commit.message, '[apk]') && hashFiles('dist/QuranDuas.apk') != '' }}
        run: |
          git fetch origin gh-pages --depth=1
          git worktree add ../site origin/gh-pages
          mkdir -p ../site/download
          cp dist/QuranDuas.apk ../site/download/QuranDuas.apk
          SIZE=$(du -m dist/QuranDuas.apk | cut -f1)
          printf '{"version":"1.1","build":%s,"sizeMB":%s,"date":"%s"}\n' "${{ github.run_number }}" "$SIZE" "$(date -u +%Y-%m-%d)" > ../site/download/version.json
          cd ../site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download
          git commit -m "Publish Android APK build ${{ github.run_number }}"
          git push origin HEAD:gh-pages
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: quran-duas-play-store-aab
          path: android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: quran-duas-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
