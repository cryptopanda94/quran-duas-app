name: Build reciter audio
on:
  workflow_dispatch:
    inputs:
      folder: {description: 'everyayah.com folder', required: true, default: 'Abdurrahmaan_As-Sudais_64kbps'}
      slug: {description: 'short name', required: true, default: 'sudais'}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: gh-pages, path: pages}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 scripts/build-reciter.py "${{ inputs.folder }}" "${{ inputs.slug }}" pages "src/data/aud_${{ inputs.slug }}.json"
      - run: du -sh pages/audio/${{ inputs.slug }}
      - name: Publish audio to gh-pages
        run: |
          cd pages && git config user.name github-actions && git config user.email actions@github.com
          git add audio/${{ inputs.slug }} && git commit -qm "Audio: ${{ inputs.slug }}" && git push
      - name: Commit timings
        run: |
          git config user.name github-actions && git config user.email actions@github.com
          git pull -q --rebase origin main || true
          git add src/data/aud_${{ inputs.slug }}.json && git commit -m "Timings: ${{ inputs.slug }} [skip ci]" && git push
