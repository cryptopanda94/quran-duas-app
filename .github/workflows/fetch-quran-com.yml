name: Fetch Quran.com translation
on:
  workflow_dispatch:
    inputs:
      tid: {description: 'Quran.com translation id', required: true}
      out: {description: 'output file name in src/data', required: true}
      label: {description: 'source label', required: true}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env: {TID: "${{ inputs.tid }}", OUT: "${{ inputs.out }}", LABEL: "${{ inputs.label }}"}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request,time
          tid=os.environ['TID'];res={}
          for ch in range(1,115):
              url=f'https://api.quran.com/api/v4/verses/by_chapter/{ch}?translations={tid}&per_page=300&words=false'
              for i in range(5):
                  try:
                      d=json.load(urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'quran-duas-build'}),timeout=30));break
                  except Exception as e:
                      print('retry',ch,e);time.sleep(3)
              t=[v['translations'][0] for v in d['verses']]
              clean=lambda s:' '.join(re.sub(r'<sup[^>]*>.*?</sup>','',s).replace('<br>',' ').split())
              clean2=lambda s:re.sub(r'<[^>]+>','',clean(s))
              res[ch]='\n'.join(clean2(x['text']) for x in t)
          out=[res[c] for c in range(1,115)]
          n=sum(len(x.split('\n')) for x in out);print('verses',n);assert n==6236,n
          print(out[0].split('\n')[:2]);print(out[1].split('\n')[152])
          json.dump({'source':os.environ['LABEL'],'e':out},open('src/data/'+os.environ['OUT'],'w'),ensure_ascii=False)
          PY
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add src/data/ && git commit -m "Add translation ${{ inputs.out }} [skip ci]" && git push
