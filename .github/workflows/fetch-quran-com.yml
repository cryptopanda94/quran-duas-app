name: Fetch Quran.com translation
on:
  workflow_dispatch:
    inputs:
      tid: {description: 'Quran.com translation id', required: true}
      out: {description: 'output file name in src/data', required: true}
      label: {description: 'source label', required: true}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env: {TID: "${{ inputs.tid }}", OUT: "${{ inputs.out }}", LABEL: "${{ inputs.label }}"}
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request
          tid=os.environ['TID']
          meta=json.load(open('src/data/data.json'))['m']
          url=f'https://api.quran.com/api/v4/quran/translations/{tid}'
          d=json.load(urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'quran-duas-build'}),timeout=120))
          t=d['translations'];print('count',len(t),json.dumps(d.get('meta',{}))[:200]);print(json.dumps(t[:2])[:400])
          clean=lambda s:re.sub(r'<[^>]+>','',' '.join(re.sub(r'<sup[^>]*>.*?</sup>','',s).replace('<br>',' ').split()))
          assert len(t)==6236,len(t)
          out=[];i=0
          for m in meta:
              out.append('\n'.join(clean(x['text']) for x in t[i:i+m[4]]));i+=m[4]
          print(out[0].split('\n')[:2]);print(out[1].split('\n')[152])
          json.dump({'source':os.environ['LABEL'],'e':out},open('src/data/'+os.environ['OUT'],'w'),ensure_ascii=False)
          PY
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add src/data/ && git commit -m "Add translation ${{ inputs.out }} [skip ci]" && git push
